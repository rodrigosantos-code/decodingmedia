<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decoding Media - Proyectos</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase Cloud SDK y Cliente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #090a0f;
      --bg-card: rgba(18, 21, 31, 0.75);
      --bg-card-hover: rgba(26, 31, 46, 0.9);
      --bg-input: rgba(13, 15, 24, 0.85);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-card-hover: rgba(255, 255, 255, 0.16);
      
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.2);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --danger: #f87171;
    }

    body {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(ellipse 70% 50% at 20% 0%, rgba(236, 72, 153, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(168, 85, 247, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 100%, rgba(56, 189, 248, 0.03) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 64px;
      background: rgba(9, 10, 15, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .brand-sticker-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #db2777;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-card-hover);
      color: #fff;
    }

    .btn-outline-danger {
      background: transparent;
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: var(--danger);
    }

    .btn-outline-danger:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: var(--danger);
    }

    /* Container */
    .dashboard-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 32px 64px 32px;
      width: 100%;
      flex: 1;
    }

    /* Welcome Hero */
    .welcome-hero {
      margin-bottom: 40px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(236, 72, 153, 0.08);
      border: 1px solid rgba(236, 72, 153, 0.2);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .hero-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 620px;
      line-height: 1.6;
    }

    /* Control Bar */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-card);
      flex-wrap: wrap;
    }

    .projects-count {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .projects-count span {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      margin-left: 6px;
    }

    .search-input-wrap {
      position: relative;
      width: 260px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.25);
      background: var(--bg-card-hover);
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* Project Card */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.22s ease;
      position: relative;
    }

    .project-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-card-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-id-tag {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-dim);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-actions .btn {
      flex: 1;
      padding: 7px 12px;
      font-size: 11px;
    }

    .btn-icon-only {
      flex: 0 0 auto !important;
      padding: 7px 9px !important;
    }

    /* New Project Card Placeholder */
    .new-project-card {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 16px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 170px;
    }

    .new-project-card:hover {
      border-color: var(--accent);
      background: rgba(236, 72, 153, 0.03);
    }

    .new-project-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .new-project-card:hover .new-project-icon {
      border-color: var(--accent);
      color: #fff;
    }

    .new-project-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .new-project-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: rgba(17, 20, 31, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      width: 92%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: rgba(13, 15, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(17, 20, 31, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      z-index: 2000;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand-title">
      <span class="brand-logo-text">Decoding Media</span>
      <span class="brand-sticker-badge">Control Hub</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-primary" onclick="openNewDeckModal()">
        + Nuevo Proyecto
      </button>
      <a href="presentation.html" target="_blank" class="btn btn-secondary" title="Abrir pantalla de proyección general">
        Abrir Escenario &nearr;
      </a>
    </div>
  </header>

  <main class="dashboard-container">
    <!-- Hero Bienvenida -->
    <div class="welcome-hero">
      <div class="hero-badge">Workspace</div>
      <h1 class="hero-title">Bienvenido a Decoding Media</h1>
      <p class="hero-subtitle">
        Centro de control y gestión de presentaciones en directo. Selecciona un proyecto para abrir la sala de realización o crea uno nuevo.
      </p>
    </div>

    <!-- Barra de Control y Búsqueda -->
    <div class="control-bar">
      <div class="projects-count">
        Proyectos <span id="projects-total-count">0</span>
      </div>

      <div class="search-input-wrap">
        <input type="text" id="search-projects" class="search-input" placeholder="Buscar proyecto..." oninput="filterProjects(this.value)" />
      </div>
    </div>

    <!-- Rejilla de Proyectos -->
    <div class="projects-grid" id="projects-grid">
      <!-- Se genera dinámicamente -->
    </div>
  </main>

  <!-- Modal Nuevo Proyecto -->
  <div class="modal-overlay" id="new-deck-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Nuevo Proyecto</h3>
        <button class="modal-close" onclick="closeNewDeckModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre del Proyecto</label>
        <input type="text" id="new-deck-name-input" class="form-input" placeholder="Ej: Mesa Redonda - Sesión Tarde" />
      </div>

      <div class="form-group">
        <label class="form-label">Plantilla Inicial</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
            <input type="radio" name="new-deck-template" value="preset" checked style="accent-color: #ec4899;" />
            Plantilla estándar (3:4 Móvil + 16:9 Escenario)
          </label>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
            <input type="radio" name="new-deck-template" value="empty" style="accent-color: #ec4899;" />
            En blanco (1 escena vacía)
          </label>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="closeNewDeckModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="confirmCreateNewDeck()">Crear y Abrir</button>
      </div>
    </div>
  </div>

  <!-- Modal Renombrar Proyecto -->
  <div class="modal-overlay" id="rename-deck-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Renombrar Proyecto</h3>
        <button class="modal-close" onclick="closeRenameDeckModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Nuevo Nombre</label>
        <input type="text" id="rename-deck-input" class="form-input" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="closeRenameDeckModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="confirmRenameDeck()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Acción completada</div>

  <script>
    // Limpieza de URL: oculta 'index.html' de la barra de direcciones dejando '/'
    try {
      if (window.location.pathname.endsWith('index.html')) {
        const cleanPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState({}, document.title, cleanPath + window.location.search);
      }
    } catch (e) {}

    let allDecks = [];
    let renameTargetId = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        t.style.display = 'none';
      }, 2500);
    }

    function formatDate(isoStr) {
      if (!isoStr) return 'Reciente';
      try {
        const d = new Date(isoStr);
        return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return 'Reciente';
      }
    }

    async function loadProjects() {
      const grid = document.getElementById('projects-grid');
      const countEl = document.getElementById('projects-total-count');

      if (window.DMCloud) {
        allDecks = await DMCloud.listDecks();
      } else {
        allDecks = [{ id: 'default', name: 'Presentación Principal', updated_at: new Date().toISOString() }];
      }

      if (countEl) countEl.textContent = allDecks.length;
      renderProjects(allDecks);
    }

    function renderProjects(decksToRender) {
      const grid = document.getElementById('projects-grid');
      if (!grid) return;

      let html = '';

      decksToRender.forEach(deck => {
        const isDefault = (deck.id === 'default');
        const formattedDate = formatDate(deck.updated_at);

        html += `
          <div class="project-card">
            <div>
              <div class="card-top">
                <div>
                  <h2 class="card-name">${escapeHtml(deck.name)}</h2>
                  <span class="card-id-tag">${escapeHtml(deck.id)}</span>
                </div>
                ${!isDefault ? `
                  <div style="display: flex; gap: 4px;">
                    <button class="btn btn-secondary btn-icon-only" onclick="openRenameModal('${deck.id}', '${escapeHtml(deck.name)}')" title="Renombrar">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </button>
                    <button class="btn btn-secondary btn-icon-only" style="color: var(--danger);" onclick="deleteProject('${deck.id}', '${escapeHtml(deck.name)}')" title="Eliminar">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                  </div>
                ` : `
                  <button class="btn btn-secondary btn-icon-only" onclick="openRenameModal('${deck.id}', '${escapeHtml(deck.name)}')" title="Renombrar">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                  </button>
                `}
              </div>

              <div class="card-meta">
                <span>Modificado: ${formattedDate}</span>
              </div>
            </div>

            <div class="card-actions">
              <a href="editor.html?deck=${encodeURIComponent(deck.id)}" class="btn btn-primary">
                Abrir Mesa de Control
              </a>
              <a href="presentation.html?deck=${encodeURIComponent(deck.id)}" target="_blank" class="btn btn-secondary" title="Ver escenario">
                Escenario &nearr;
              </a>
            </div>
          </div>
        `;
      });

      // Tarjeta adicional "+ Crear nuevo proyecto"
      html += `
        <div class="new-project-card" onclick="openNewDeckModal()">
          <div class="new-project-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <div class="new-project-title">Nuevo Proyecto</div>
          <div class="new-project-desc">Crear una nueva presentación en directo</div>
        </div>
      `;

      grid.innerHTML = html;
    }

    function filterProjects(query) {
      const q = (query || '').toLowerCase().trim();
      if (!q) {
        renderProjects(allDecks);
        return;
      }
      const filtered = allDecks.filter(d => 
        (d.name && d.name.toLowerCase().includes(q)) || 
        (d.id && d.id.toLowerCase().includes(q))
      );
      renderProjects(filtered);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Modal Nuevo Deck
    function openNewDeckModal() {
      const modal = document.getElementById('new-deck-modal');
      const input = document.getElementById('new-deck-name-input');
      if (input) input.value = `Proyecto ${allDecks.length + 1}`;
      if (modal) modal.style.display = 'flex';
      if (input) input.focus();
    }

    function closeNewDeckModal() {
      const modal = document.getElementById('new-deck-modal');
      if (modal) modal.style.display = 'none';
    }

    async function confirmCreateNewDeck() {
      const input = document.getElementById('new-deck-name-input');
      const name = (input ? input.value.trim() : '') || 'Nuevo Proyecto';
      const templateChoice = document.querySelector('input[name="new-deck-template"]:checked')?.value || 'preset';

      let initialSlots = [];
      if (templateChoice === 'empty') {
        initialSlots = [
          {
            id: 'slot-' + Date.now(),
            name: 'Escena 1',
            format: '3:4',
            speaker: '',
            url: '',
            slidesCount: 1,
            calib: { left: 28.55, width: 47.7, top: -2.85, height: 111.45, radius: 45, rot: -0.8, zoom: 100 }
          }
        ];
      } else {
        initialSlots = [
          {
            id: 'slot-1',
            name: 'Escena Móvil',
            format: '3:4',
            speaker: '',
            url: '',
            slidesCount: 5,
            calib: { left: 28.55, width: 47.7, top: -2.85, height: 111.45, radius: 45, rot: -0.8, zoom: 100 }
          },
          {
            id: 'slot-2',
            name: 'Escena Pantalla',
            format: '16:9',
            speaker: '',
            url: '',
            slidesCount: 5,
            calib: { left: 7.2, width: 85.85, top: 15.45, height: 66.7, radius: 12, rot: 0, zoom: 141 }
          }
        ];
      }

      const newId = 'deck-' + Date.now();
      closeNewDeckModal();
      showToast(`Creando ${name}...`);

      if (window.DMCloud) {
        await DMCloud.createDeck(newId, name, initialSlots);
      } else {
        localStorage.setItem('dm_deck_slots_' + newId, JSON.stringify(initialSlots));
        localStorage.setItem('dm_active_deck_id', newId);
      }

      // Redirigir a la mesa de control del proyecto recién creado
      window.location.href = `editor.html?deck=${encodeURIComponent(newId)}`;
    }

    // Modal Renombrar
    function openRenameModal(deckId, currentName) {
      renameTargetId = deckId;
      const modal = document.getElementById('rename-deck-modal');
      const input = document.getElementById('rename-deck-input');
      if (input) input.value = currentName || '';
      if (modal) modal.style.display = 'flex';
      if (input) input.focus();
    }

    function closeRenameDeckModal() {
      const modal = document.getElementById('rename-deck-modal');
      if (modal) modal.style.display = 'none';
      renameTargetId = null;
    }

    async function confirmRenameDeck() {
      if (!renameTargetId) return;
      const input = document.getElementById('rename-deck-input');
      const newName = input ? input.value.trim() : '';
      if (!newName) return;

      closeRenameDeckModal();
      showToast('Actualizando nombre...');

      if (window.DMCloud) {
        // Obtener slots actuales de este deck para guardarlo con nuevo nombre
        const existingData = await DMCloud.fetchDeckConfig(renameTargetId);
        const slotsToKeep = (existingData && existingData.slots) || [];
        await DMCloud.saveDeckConfig(slotsToKeep, '20260923_def_v2', 'dashboard_rename', renameTargetId, newName);
      }

      await loadProjects();
      showToast('Proyecto renombrado');
    }

    async function deleteProject(deckId, name) {
      if (deckId === 'default') {
        alert('El proyecto principal no se puede eliminar.');
        return;
      }
      if (!confirm(`¿Estás seguro de eliminar el proyecto "${name}"?`)) return;

      showToast('Eliminando proyecto...');
      if (window.DMCloud) {
        await DMCloud.deleteDeck(deckId);
      }
      localStorage.removeItem('dm_deck_slots_' + deckId);
      await loadProjects();
      showToast('Proyecto eliminado');
    }

    // Carga inicial
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadProjects, 150);
    });
  </script>
</body>
</html>
